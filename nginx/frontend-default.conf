server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;

    # --- Compression ---------------------------------------------------------
    # The map/detail pages fetch large static assets (ecoregions-latam.geojson
    # ~3.0 MB, koppen-latam.geojson ~1.7 MB, latin-america-countries.js ~1.3 MB).
    # gzip shrinks these JSON/JS payloads ~70% (verified: ecoregions 3.02 MB ->
    # 0.99 MB). gzip_vary adds `Vary: Accept-Encoding` so shared caches store
    # both the compressed and uncompressed variants.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        application/geo+json
        text/javascript
        text/css
        text/plain
        image/svg+xml;

    # HTML must never be cached hard, so a deploy (and the ?v= asset bumps the
    # HTML references) takes effect immediately. NOTE: try_files serving a found
    # file stays in THIS location and does NOT re-match the regex `.html` rule
    # below, so the no-cache header is set directly on each HTML entry point.
    location = / {
        add_header Cache-Control "no-cache";
        try_files /html/index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files /html/index.html =404;
    }

    # The detail page lives under html/ but is linked as "detail.html?id=..."
    # (root-relative) from the map/list. Serve it at the root URL like index.html
    # so the link resolves and its absolute /js, /styles assets load against root.
    location = /detail.html {
        add_header Cache-Control "no-cache";
        try_files /html/detail.html =404;
    }

    # Defense in depth: any other .html requested directly also stays uncached.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # .geojson is not in nginx's default mime.types -> it would be served as
    # application/octet-stream, which gzip_types does not match. Force JSON so
    # the two big GeoJSON layers actually get compressed.
    location ~* \.geojson$ {
        default_type application/json;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Long-cache fingerprinted static assets. They are versioned at the call site
    # via a ?v= query string, so a 30d immutable cache is safe; bumping ?v= fetches
    # the new file. HTML (above) stays uncached, so version bumps propagate.
    location ~* \.(js|css|svg|png|jpe?g|gif|webp|woff2?|ico)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
        try_files $uri =404;
    }
}
