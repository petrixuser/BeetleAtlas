services:
  beetle-db:
    image: mysql:8.0
    container_name: beetle-db
    restart: unless-stopped
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-beetle_db}
      - MYSQL_USER=${DB_APP_USER:-beetle_app}
      - MYSQL_PASSWORD=${DB_APP_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - beetle_db_data:/var/lib/mysql
      - ./backend/sql/schema/DatabseShema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/sql/ops/AddMapQueryIndexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
      - ./backend/sql/seed/SeedCoreData.sql:/docker-entrypoint-initdb.d/03_seed_core.sql:ro
      - ./backend/sql/seed/SeedFeaturedData.sql:/docker-entrypoint-initdb.d/04_seed_featured.sql:ro
      - ./backend/data:/var/lib/mysql-files
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${DB_APP_USER:-beetle_app}", "-p${DB_APP_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  beetle-backend:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile
    container_name: beetle-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST:-beetle-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_APP_USER:-beetle_app}
      - DB_PASSWORD=${DB_APP_PASSWORD}
      - DB_NAME=${DB_NAME:-beetle_db}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_APP_MODULE=backend.core.main:app
      - ENABLE_SLOW_QUERY_LOGGING=${ENABLE_SLOW_QUERY_LOGGING:-true}
      - SLOW_QUERY_MS=${SLOW_QUERY_MS:-300}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost:8080}
      - ALLOW_ADMIN_BOOTSTRAP=${ALLOW_ADMIN_BOOTSTRAP:-true}
      - ADMIN_BOOTSTRAP_TOKEN=${ADMIN_BOOTSTRAP_TOKEN}
      - RESEARCHER_SIGNUP_CODE=${RESEARCHER_SIGNUP_CODE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TTL_MINUTES=${JWT_ACCESS_TTL_MINUTES:-30}
      - JWT_REFRESH_TTL_DAYS=${JWT_REFRESH_TTL_DAYS:-14}
      - AUTH_REFRESH_MAX_REQUESTS=${AUTH_REFRESH_MAX_REQUESTS:-30}
      - AUTH_REFRESH_WINDOW_SECONDS=${AUTH_REFRESH_WINDOW_SECONDS:-60}
      - REDIS_URL=${REDIS_URL:-redis://beetle-redis:6379/0}
    depends_on:
      beetle-db:
        condition: service_healthy
      beetle-redis:
        condition: service_started

  beetle-redis:
    image: redis:7-alpine
    container_name: beetle-redis
    restart: unless-stopped

  beetle-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beetle-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - GMAPS_KEY=${GMAPS_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8000}
    depends_on:
      beetle-backend:
        condition: service_started

volumes:
  beetle_db_data:
