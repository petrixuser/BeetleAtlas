services:
  beetle-db:
    # Build the same full-pipeline image used in production (Dockerfile.db) so
    # dev exercises the exact server DB artifact. The image bakes schema + seed +
    # all consolidated migrations + read models + CSV data in the correct order,
    # so a fresh volume yields a COMPLETE DB. (Previously this bind-mounted only a
    # partial set of init scripts in a broken order — beetle_record was seeded
    # before it was created — and relied on a runtime migration step that cannot
    # execute the migrations' DELIMITER/procedure blocks.)
    build:
      context: .
      dockerfile: backend/docker/Dockerfile.db
    container_name: beetle-db
    restart: unless-stopped
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root123}
      - MYSQL_DATABASE=${DB_NAME:-beetle_db}
    ports:
      - "3306:3306"
    volumes:
      - beetle_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 20
      # Der ALLERERSTE Start seedet ~215MB CSV + baut Indizes auf 417k Zeilen.
      # Das dauert auf manchen Rechnern >3 Min. Ohne start_period zählen die
      # fehlschlagenden Checks sofort als "unhealthy" und Compose bricht den
      # Start ab (Backend/Frontend starten dann nie). start_period gibt dem
      # Kalt-Seed bis zu 10 Min Zeit; spätere Starts sind ohnehin in Sekunden gesund.
      start_period: 600s

  beetle-backend:
    build:
      context: .
      dockerfile: backend/docker/Dockerfile
    container_name: beetle-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=${DB_HOST:-beetle-db}
      - DB_PORT=${DB_PORT:-3306}
      # App runs as a least-privilege user (NOT root — db.py enforces). This dev DB
      # has no MYSQL_USER, so beetle_app does NOT pre-exist on the fresh volume —
      # run_migrations.py (as root) bootstraps it, exactly like the prod in-place case.
      - DB_USER=${DB_APP_USER:-beetle_app}
      - DB_PASSWORD=${DB_APP_PASSWORD:-beetleapp123}
      - DB_NAME=${DB_NAME:-beetle_db}
      # Migrations run as root (DDL + creates the app user above).
      - DB_MIGRATION_USER=${DB_MIGRATION_USER:-root}
      - DB_MIGRATION_PASSWORD=${DB_PASSWORD:-root123}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - API_APP_MODULE=backend.core.main:app
      - ENABLE_SLOW_QUERY_LOGGING=${ENABLE_SLOW_QUERY_LOGGING:-true}
      - SLOW_QUERY_MS=${SLOW_QUERY_MS:-300}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost:8080}
      - ALLOW_ADMIN_BOOTSTRAP=${ALLOW_ADMIN_BOOTSTRAP:-true}
      - ADMIN_BOOTSTRAP_TOKEN=${ADMIN_BOOTSTRAP_TOKEN}
      - RESEARCHER_SIGNUP_CODE=${RESEARCHER_SIGNUP_CODE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TTL_MINUTES=${JWT_ACCESS_TTL_MINUTES:-30}
      - JWT_REFRESH_TTL_DAYS=${JWT_REFRESH_TTL_DAYS:-14}
      - AUTH_REFRESH_MAX_REQUESTS=${AUTH_REFRESH_MAX_REQUESTS:-30}
      - AUTH_REFRESH_WINDOW_SECONDS=${AUTH_REFRESH_WINDOW_SECONDS:-60}
      - REDIS_URL=${REDIS_URL:-redis://beetle-redis:6379/0}
      # E-Mail-Verifizierung: standardmaessig aktiv gegen den lokalen Mailpit-SMTP.
      # Mailpit-Web-UI zum Ansehen der Mails: http://localhost:8025
      #
      # Fuer ECHTEN Versand (z. B. Gmail) einfach in der .env setzen:
      #   SMTP_HOST=smtp.gmail.com, SMTP_PORT=587, SMTP_USE_STARTTLS=true,
      #   SMTP_USERNAME=<gmail-adresse>, SMTP_PASSWORD=<16-stelliges App-Passwort>
      # Compose liest die .env automatisch; diese Werte ueberschreiben dann Mailpit.
      - EMAIL_VERIFICATION_SEND_EMAIL=${EMAIL_VERIFICATION_SEND_EMAIL:-true}
      - SMTP_HOST=${SMTP_HOST:-beetle-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_USE_STARTTLS=${SMTP_USE_STARTTLS:-false}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-noreply@beetleatlas.local}
      - EMAIL_VERIFICATION_BASE_URL=${EMAIL_VERIFICATION_BASE_URL:-http://localhost:8080}
    depends_on:
      beetle-db:
        condition: service_healthy
      beetle-redis:
        condition: service_started
      beetle-mailpit:
        condition: service_started

  beetle-redis:
    image: redis:7-alpine
    container_name: beetle-redis
    restart: unless-stopped

  # Lokaler Test-Mailserver: faengt Verifizierungs-E-Mails ab (kein echter Versand).
  # SMTP auf :1025, Web-Oberflaeche zum Lesen der Mails auf http://localhost:8025
  beetle-mailpit:
    image: axllent/mailpit:latest
    container_name: beetle-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  beetle-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beetle-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - GMAPS_KEY=${GMAPS_KEY:-}
      - API_BASE_URL=${API_BASE_URL:-http://localhost:8000}
    depends_on:
      beetle-backend:
        condition: service_started

volumes:
  beetle_db_data:
