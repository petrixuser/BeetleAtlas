name: API Contract Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  contract-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/tests/requirements-test.txt

      - name: Start API stack (DB + backend)
        run: docker compose -f docker-compose.dev.yml up -d beetle-db beetle-backend

      - name: Wait for backend health
        env:
          API_BASE_URL: http://127.0.0.1:8000
        run: |
          for i in {1..60}; do
            if curl -fsS "$API_BASE_URL/health" >/dev/null; then
              echo "Backend is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy in time."
          docker compose -f docker-compose.dev.yml logs beetle-db beetle-backend
          exit 1

      - name: Run contract tests
        env:
          API_BASE_URL: http://127.0.0.1:8000
          API_TEST_TIMEOUT: "90"
          API_ADMIN_EMAIL: admin.contract@example.local
          API_ADMIN_PASSWORD: AdminContract123!
          API_BOOTSTRAP_TOKEN: dev-bootstrap-token
        run: pytest backend/tests -q

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs beetle-db beetle-backend

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v